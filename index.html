<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f5f5f5;
    }
    #welcome-btn {
      font-size: 1.5em;
      padding: 1em 2em;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
    }
    .confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
    }
    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: red;
      opacity: 0.7;
      animation: fall linear;
      animation-iteration-count: 1;
    }
    @keyframes fall {
      0% {
        transform: translateY(-100vh) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <button id="welcome-btn">Welcome</button>
  <div id="confetti" class="confetti" style="display:none;"></div>
  <script>
    function randomColor() {
      const colors = ['#FFC107', '#E91E63', '#03A9F4', '#4CAF50', '#FFEB3B', '#9C27B0'];
      return colors[Math.floor(Math.random() * colors.length)];
    }
    function createConfettiPiece() {
      const div = document.createElement('div');
      div.className = 'confetti-piece';
      div.style.backgroundColor = randomColor();
      div.style.left = Math.random() * 100 + 'vw';
      div.style.animationDuration = 2 + Math.random() * 3 + 's';
      div.style.animationIterationCount = '1';
      return div;
    }
    document.getElementById('welcome-btn').addEventListener('click', function() {
      const confettiContainer = document.getElementById('confetti');
      confettiContainer.style.display = 'block';
      for (let i = 0; i < 100; i++) {
        confettiContainer.appendChild(createConfettiPiece());
      }
      // Remove confetti after animation
      setTimeout(() => {
        confettiContainer.innerHTML = '';
        confettiContainer.style.display = 'none';
      }, 5000);
    });
  </script>
</body>
</html>
